spring.application.name=TablaTiempos
server.port=8888

spring.datasource.url=jdbc:h2:file:${app.data.dir}/tabla-tiempos;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false

server.servlet.session.timeout=${SESSION_TIMEOUT:30d}
server.servlet.session.cookie.max-age=${SESSION_TIMEOUT:30d}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
